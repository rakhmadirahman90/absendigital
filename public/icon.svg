<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield / Icon Frame -->
  <rect width="512" height="512" rx="110" fill="url(#pwaGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Sulawesi Walasuji Watermark Accent -->
  <g opacity="0.12">
    <path d="M 256,60 L 452,256 L 256,452 L 60,256 Z" fill="none" stroke="#60a5fa" stroke-width="8" />
    <path d="M 256,120 L 392,256 L 256,392 L 120,256 Z" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 8" />
  </g>

  <!-- Central Location Pin & Clock Badge -->
  <g transform="translate(256, 230)">
    <!-- Location Pin Pin Head -->
    <path d="M 0,-110 C -55,-110 -100,-65 -100,-10 C -100,50 -20,110 0,160 C 20,110 100,50 100,-10 C 100,-65 55,-110 0,-110 Z" fill="url(#accentGrad)" />
    
    <!-- White Circle Center -->
    <circle cx="0" cy="-10" r="46" fill="#ffffff" />

    <!-- Clock hands inside location pin -->
    <path d="M 0,-10 L 0,-32 M 0,-10 L 16,-10" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" />

    <!-- Checkmark Badge -->
    <circle cx="48" cy="48" r="32" fill="#10b981" />
    <path d="M 34,48 L 44,58 L 62,38" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Text Pill at Bottom -->
  <rect x="116" y="400" width="280" height="54" rx="27" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    HADIR 162
  </text>
</svg>
