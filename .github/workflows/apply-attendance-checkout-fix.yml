name: Apply Attendance Checkout Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repaired admin attendance tab
        run: |
          test -s src/pages/admin/AbsensiTab.tsx
          grep -q "const normalizeDate" src/pages/admin/AbsensiTab.tsx
          grep -q "Compatibility attendance read notice" src/pages/admin/AbsensiTab.tsx
          echo "Attendance tab repair verified."
