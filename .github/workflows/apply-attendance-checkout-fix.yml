name: Apply Attendance Checkout Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[attendance-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply dashboard real-attendance fix
        run: python3 scripts/fix-dashboard-real-attendance.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/DashboardTab.tsx
          if git diff --cached --quiet; then
            echo "No dashboard source changes were necessary."
            exit 0
          fi
          git commit -m "fix: dashboard uses real attendance only [attendance-fix-applied]"
          git push
